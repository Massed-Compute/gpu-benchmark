name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@v7 # nosemgrep: github-actions-mutable-action-tag
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks

      - name: Run gitleaks (diff only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --log-opts="${{ github.event.pull_request.base.sha }}..HEAD" --verbose
          else
            gitleaks detect --verbose
          fi
